<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Eternal Cosmic Infinity Library</title>
    <style>
        :root {
            --cosmic-black: #05010a;
            --nebula-purple: #3e125c;
            --star-gold: #f7d56b;
            --portal-teal: #0de7e7;
            --void-white: #f5f5ff;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--cosmic-black);
            color: var(--void-white);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1, h2 {
            font-family: 'Garamond', serif;
            text-align: center;
            color: var(--star-gold);
            text-shadow: 0 0 10px rgba(247, 213, 107, 0.7);
        }

        .portal-header {
            border: 2px solid var(--portal-teal);
            padding: 20px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--cosmic-black), var(--nebula-purple));
            box-shadow: 0 0 20px var(--portal-teal);
            width: 90%;
            max-width: 800px;
        }

        .input-section, .search-section {
            background-color: rgba(62, 18, 92, 0.3);
            border: 1px solid var(--nebula-purple);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            margin-bottom: 30px;
        }

        .search-section {
            border-color: var(--portal-teal);
            box-shadow: inset 0 0 10px rgba(13, 231, 231, 0.2);
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--portal-teal);
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--star-gold);
            background-color: var(--cosmic-black);
            color: var(--void-white);
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            background-color: var(--star-gold);
            color: var(--cosmic-black);
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #fce79f;
        }

        button:active {
            transform: scale(0.98);
        }

        .card-actions {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .edit-btn {
            background-color: transparent;
            color: var(--portal-teal);
            border: 1px solid var(--portal-teal);
            padding: 5px 10px;
            font-size: 0.8em;
            cursor: pointer;
        }

        .edit-btn:hover {
            background-color: var(--portal-teal);
            color: var(--cosmic-black);
        }

        .delete-btn {
            background-color: transparent;
            color: #ff5555;
            border: 1px solid #ff5555;
            padding: 5px 10px;
            font-size: 0.8em;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #ff5555;
            color: var(--cosmic-black);
        }

        .library-display {
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .book-card {
            background-color: var(--nebula-purple);
            border: 1px solid var(--star-gold);
            padding: 15px;
            border-radius: 5px;
            transition: box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .book-card:hover {
            box-shadow: 0 0 15px var(--portal-teal);
        }

        .book-title {
            color: var(--void-white);
            margin-top: 0;
            border-bottom: 1px solid var(--void-white);
            padding-bottom: 5px;
        }

        .book-cover {
            width: 100px;
            height: 150px;
            object-fit: cover;
            border: 1px solid var(--void-white);
            float: left;
            margin-right: 15px;
        }

        .review-text {
            color: var(--void-white);
            font-style: italic;
        }

        .cosmic-relation {
            margin-top: 10px;
            color: var(--portal-teal);
            font-weight: bold;
        }

        .star-rating {
            color: var(--star-gold);
        }
    </style>
</head>
<body>

    <div class="portal-header">
        <h1>Welcome to the Eternal Cosmic Infinity Library</h1>
        <h2>Add your knowledge to the infinite expanse...</h2>
    </div>

    <!-- Input Section -->
    <div class="input-section">
        <div class="input-group">
            <label for="bookTitle">Book Title:</label>
            <input type="text" id="bookTitle" placeholder="Enter book title (e.g., 'Cosmos')">
        </div>

        <div class="input-group">
            <label for="bookReview">Review:</label>
            <textarea id="bookReview" placeholder="Describe the knowledge within..."></textarea>
        </div>

        <div class="input-group">
            <label for="cosmicRelation">How it relates to the Eternal Cosmic Infinity Portal:</label>
            <input type="text" id="cosmicRelation" placeholder="Connect this text to the infinite...">
        </div>

        <div class="input-group">
            <label for="bookRating">Rating (1-5 Cosmic Stars):</label>
            <input type="number" id="bookRating" min="1" max="5">
        </div>

        <div class="input-group">
            <label for="bookCover">Book Cover (Image File):</label>
            <input type="file" id="bookCover" accept="image/*">
        </div>

        <button id="addBookBtn">Add to the Library</button>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <div class="input-group" style="margin-bottom: 0;">
            <label for="searchBooks">Search the Library:</label>
            <input type="text" id="searchBooks" placeholder="Filter by title, review, or cosmic connection...">
        </div>
    </div>

    <div id="libraryDisplay" class="library-display"></div>

    <script>
        const STORAGE_KEY = 'eternal_cosmic_infinity_books';

        document.addEventListener('DOMContentLoaded', renderLibrary);

        document.getElementById('addBookBtn').addEventListener('click', function() {
            const titleInput = document.getElementById('bookTitle');
            const reviewInput = document.getElementById('bookReview');
            const relationInput = document.getElementById('cosmicRelation');
            const ratingInput = document.getElementById('bookRating');
            const coverInput = document.getElementById('bookCover');

            const title = titleInput.value.trim();
            const review = reviewInput.value.trim();
            const relation = relationInput.value.trim();
            const rating = parseInt(ratingInput.value, 10);

            // Validate fields immediately before processing files
            if (!title || !review || !relation || isNaN(rating)) {
                alert("Please fill in all cosmic data points.");
                return;
            }

            const saveAndReset = (coverSrc) => {
                const newBook = {
                    id: Date.now(),
                    title,
                    review,
                    relation,
                    rating,
                    cover: coverSrc
                };

                const books = getSavedBooks();
                books.push(newBook);
                saveBooks(books);
                renderLibrary();

                // Clear input fields
                titleInput.value = '';
                reviewInput.value = '';
                relationInput.value = '';
                ratingInput.value = '';
                coverInput.value = '';
            };

            // Handle file reader safely
            if (coverInput.files && coverInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveAndReset(e.target.result);
                };
                reader.onerror = function() {
                    // Fallback if image reading fails
                    saveAndReset('https://via.placeholder.com/100x150?text=Error+Loading');
                };
                reader.readAsDataURL(coverInput.files[0]);
            } else {
                saveAndReset('https://via.placeholder.com/100x150?text=No+Cover');
            }
        });

        function getSavedBooks() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? JSON.parse(saved) : [];
            } catch (e) {
                console.error("Error reading from localStorage", e);
                return [];
            }
        }

        function saveBooks(books) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
            } catch (e) {
                alert("Storage limit reached or localStorage disabled.");
            }
        }

        function removeBook(id) {
            let books = getSavedBooks();
            books = books.filter(book => book.id !== id);
            saveBooks(books);
            renderLibrary();
        }

        function editBook(id) {
            const books = getSavedBooks();
            const book = books.find(b => b.id === id);
            if (!book) return;

            const newTitle = prompt("Edit Book Title:", book.title);
            if (newTitle === null) return;

            const newReview = prompt("Edit Review:", book.review);
            if (newReview === null) return;

            const newRelation = prompt("Edit Cosmic Relation:", book.relation);
            if (newRelation === null) return;

            const newRatingStr = prompt("Edit Rating (1-5 Stars):", book.rating);
            if (newRatingStr === null) return;

            const newRating = parseInt(newRatingStr, 10);

            book.title = newTitle.trim() || book.title;
            book.review = newReview.trim() || book.review;
            book.relation = newRelation.trim() || book.relation;
            book.rating = (!isNaN(newRating) && newRating >= 1 && newRating <= 5) ? newRating : book.rating;

            saveBooks(books);
            renderLibrary();
        }

        function renderLibrary() {
            const library = document.getElementById('libraryDisplay');
            library.innerHTML = '';
            const books = getSavedBooks();

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.dataset.title = (book.title || '').toLowerCase();
                card.dataset.review = (book.review || '').toLowerCase();
                card.dataset.relation = (book.relation || '').toLowerCase();

                card.innerHTML = `
                    <img class="book-cover" src="${book.cover || 'https://via.placeholder.com/100x150?text=No+Cover'}" alt="Cover">
                    <h3 class="book-title">${escapeHTML(book.title)}</h3>
                    <p class="star-rating">${'★'.repeat(Math.max(1, Math.min(5, book.rating || 5)))}</p>
                    <p class="review-text">${escapeHTML(book.review)}</p>
                    <p class="cosmic-relation">Infinity Relation: ${escapeHTML(book.relation)}</p>
                    <div class="card-actions">
                        <button class="edit-btn" onclick="editBook(${book.id})">Edit</button>
                        <button class="delete-btn" onclick="removeBook(${book.id})">Remove</button>
                    </div>
                `;

                library.appendChild(card);
            });

            filterBooks();
        }

        const searchInput = document.getElementById('searchBooks');
        searchInput.addEventListener('input', filterBooks);

        function filterBooks() {
            const query = (searchInput.value || '').toLowerCase().trim();
            const cards = document.querySelectorAll('.book-card');

            cards.forEach(card => {
                const title = card.dataset.title || '';
                const review = card.dataset.review || '';
                const relation = card.dataset.relation || '';

                if (title.includes(query) || review.includes(query) || relation.includes(query)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
